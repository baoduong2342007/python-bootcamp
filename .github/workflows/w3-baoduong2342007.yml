name: Dương W3

on:
  pull_request:
    paths:
      - 'members/baoduong2342007/**'
      - 'shared/**'
      - 'tests/test_w3.py'
      - '.github/workflows/w3-baoduong2342007.yml'
  push:
    branches: [main]

jobs:
  duong-w3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest==8.3.3
      - run: python -m pytest -q tests/test_w3.py --member baoduong2342007
      - run: python -m pytest -q members/baoduong2342007/w3/tests
