name: Huy W3 validation

on:
  pull_request:
    branches: [main]
    paths:
      - "members/tqhuy0602/**"
      - "shared/**"
      - "tests/test_w*.py"
      - "tests/conftest.py"
      - ".github/workflows/w3-tqhuy0602.yml"
  push:
    branches: [main]
    paths:
      - "members/tqhuy0602/**"
      - "shared/**"
      - "tests/test_w*.py"
      - "tests/conftest.py"
      - ".github/workflows/w3-tqhuy0602.yml"

permissions:
  contents: read

jobs:
  huy-w3:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==8.3.3 ruff==0.6.9
      - name: Official W3 and additional cases (explicit member, no skips)
        run: python -m pytest -q tests/test_w3.py members/tqhuy0602/w3/tests --member tqhuy0602
      - name: Huy W1/W2 and shared W2 regression
        run: |
          python -m pytest -q tests/test_w1.py --member tqhuy0602 --variant 2
          python -m pytest -q tests/test_w2.py members/tqhuy0602/w2 --member tqhuy0602
          python -m pytest -q tests/shared_w2
      - name: Huy source style (official files stay unchanged)
        run: |
          python -m ruff check members/tqhuy0602 --select E,F,I,B,UP,BLE --line-length 120
          python -m ruff format --check members/tqhuy0602/w3
