name: Quyền W3 validation

on:
  pull_request:
    branches: [main]
    paths:
      - "members/pqquyenn/**"
      - "shared/**"
      - "tests/test_w*.py"
      - "tests/conftest.py"
      - ".github/workflows/w3-pqquyenn.yml"
  push:
    branches: [main]
    paths:
      - "members/pqquyenn/**"
      - "shared/**"
      - "tests/test_w*.py"
      - "tests/conftest.py"
      - ".github/workflows/w3-pqquyenn.yml"

permissions:
  contents: read

jobs:
  quyen-w3:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==8.3.3 ruff==0.6.9
      - name: Official W3 and additional cases (explicit member, no skips)
        run: python -m pytest -q tests/test_w3.py members/pqquyenn/w3/tests --member pqquyenn
      - name: Quyen W1/W2 and shared W2 regression
        run: |
          python -m pytest -q tests/test_w1.py --member pqquyenn --variant 3
          python -m pytest -q tests/test_w2.py members/pqquyenn/w2 --member pqquyenn
          python -m pytest -q tests/shared_w2
      - name: Quyen source style (official files stay unchanged)
        run: |
          python -m ruff check members/pqquyenn --select E,F,I,B,UP,BLE --line-length 120
          python -m ruff format --check members/pqquyenn/w3
